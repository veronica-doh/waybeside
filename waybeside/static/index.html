<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>伴程 · WayBeside</title>
  <link rel="stylesheet" href="style.css">
  <script src="i18n-data.js"></script>
  <script src="i18n.js"></script>
</head>
<body>
  <div id="demo-banner" class="demo-banner" role="note" data-i18n="app.demo_banner" hidden>演示 · 这里全部是虚构数据，不是任何人的真实记录。</div>
  <div class="prototype"><span data-i18n="app.banner">本地记录 · 虚构数据 · 不自动调用模型</span></div>
  <div class="shell">
    <header class="masthead">
      <a href="#today" class="brand" data-i18n-aria-label="app.brand_aria" aria-label="伴程 · WayBeside，回到今天"><span class="brand-mark" aria-hidden="true"></span><span><span data-i18n="app.title">伴程 · WayBeside</span><small data-i18n="app.tagline">这段路，一天一天走。</small></span></a>
      <span class="head-links"><a class="help-link" href="#settings" data-i18n="head.settings">设置</a><a class="help-link" href="#help" data-i18n="head.help">需要帮助</a></span>
    </header>
    <nav class="nav" data-i18n-aria-label="nav.aria" aria-label="主要页面">
      <a href="#today" data-i18n="nav.today">我的一天</a><a href="#tomorrow" data-i18n="nav.tomorrow">准备明天</a><a href="#plan" data-i18n="nav.plan">我的方案</a><a href="#labs" data-i18n="nav.labs">检查与复诊</a><a href="#course" data-i18n="nav.course">这段旅程</a>
    </nav>
    <div id="upgrade-notice" class="note neutral" role="status" hidden></div>
    <main id="main" tabindex="-1"></main>
    <p id="page-disclaimer" class="small" hidden></p>
    <footer><span data-i18n="app.tagline">这段路，一天一天走。</span><button id="reset" class="text-button" data-i18n="footer.quit">退出</button></footer>
  </div>
  <div id="gate" hidden></div>
  <div id="agent-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog"><form method="dialog"><p class="eyebrow" data-i18n="dialog.eyebrow">请再确认一下</p><h2 id="dialog-title"></h2><p id="dialog-copy"></p><div class="actions"><button value="cancel" class="secondary" data-i18n="dialog.cancel">先不改</button><button value="confirm" class="secondary" data-i18n="dialog.confirm">确认</button></div></form></dialog>
  <script src="journey.js"></script>
  <script src="app.js"></script>
  <script src="backend.js"></script>
  <script src="menu.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
